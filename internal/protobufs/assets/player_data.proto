syntax = "proto3";

package protobufs;

import "power_up_type.proto";

option go_package = "github.com/hue-go/atlas-backend/internal/protobufs";

message PlayerData {
  string player_id = 1;
  string name = 2;
  int32 hearts = 3;
  int32 score = 4;
  bool is_ready = 5;
  bool is_connected = 6;
  repeated PowerUpType available_power_ups = 7;
}